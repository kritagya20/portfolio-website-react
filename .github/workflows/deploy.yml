name: Deploy to GitHub Pages

on:
  # Triggers automatically when a Pull Request is merged into main (or direct push to main)
  push:
    branches:
      - main

  # Allows manual triggering from the GitHub Actions tab
  workflow_dispatch:

# Grant GITHUB_TOKEN permissions required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium Browser
        if: "contains(github.event.head_commit.message, '[run tests]') || contains(github.event.head_commit.message, '[run-tests]')"
        run: npx playwright install chromium

      - name: Run Playwright E2E Tests
        if: "contains(github.event.head_commit.message, '[run tests]') || contains(github.event.head_commit.message, '[run-tests]')"
        run: npm run test:e2e

      - name: Upload Playwright Test Report & Artifacts
        uses: actions/upload-artifact@v4
        if: "always() && (contains(github.event.head_commit.message, '[run tests]') || contains(github.event.head_commit.message, '[run-tests]'))"
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30

      - name: Build project
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
