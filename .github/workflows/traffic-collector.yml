name: Update Visitor Traffic Stats

on:
  schedule:
    # Runs daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  collect-traffic:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Traffic Collector Script
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/update-visitor-stats.js

      - name: Commit and Push Updated Stats
        id: push-stats
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          if [ -n "$(git status --porcelain public/visitor-stats.json)" ]; then
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
            git add public/visitor-stats.json
            git commit -m "stats: update visitor traffic metrics [${TIMESTAMP}]"
            git push
            echo "Updated visitor stats pushed to main at ${TIMESTAMP}."
            echo "stats_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes detected in visitor stats."
            echo "stats_changed=false" >> "$GITHUB_OUTPUT"
          fi

      # GITHUB_TOKEN push events do NOT trigger other workflows (GitHub security policy).
      # We must explicitly trigger the deploy workflow via workflow_dispatch.
      - name: Trigger Deploy Workflow
        if: steps.push-stats.outputs.stats_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Triggering deploy workflow to publish updated visitor stats..."
          gh workflow run "Deploy to GitHub Pages" --ref main
          echo "Deploy workflow triggered successfully."
